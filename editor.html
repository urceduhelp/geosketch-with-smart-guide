<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoSketch – Data Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d2b45;--grid:#1aa7ec;--paper:#f4f8fb;--red:#d6212b}
*{box-sizing:border-box}
body{margin:0;font:14px 'Noto Sans Sinhala','Iskoola Pota',sans-serif;background:var(--paper);color:var(--ink)}
header{background:var(--ink);color:#fff;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:20px}h1 i{font-style:normal;color:var(--grid)}
select,button,input,textarea{font:inherit;padding:6px 9px;border-radius:6px;border:1px solid #9bb;color:var(--ink)}
button{background:var(--grid);color:#fff;border:0;font-weight:700;cursor:pointer}button.alt{background:#fff;color:var(--ink);border:1px solid #9bb;font-weight:400}
.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;padding:12px}
@media(max-width:900px){.app{grid-template-columns:1fr}}
#vp{position:relative;min-width:0}
#box{height:calc(100vh - 80px);min-height:420px;overflow:auto;display:flex;background:#dbe5ec;border:1px solid #c3d5e0;border-radius:6px}
@media(max-width:900px){#box{height:70vh}}
canvas{background:#fff;box-shadow:0 2px 14px #0003;cursor:crosshair;touch-action:manipulation}
aside{display:flex;flex-direction:column;gap:10px}
.box{background:#fff;border:1px solid #cfe0ea;border-radius:8px;padding:10px}
.box h3{margin:0 0 6px;font-size:14px}
.tools label{display:block;padding:3px 0;cursor:pointer}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#name{width:100%}
#list{max-height:230px;overflow:auto;margin:0;padding:0;list-style:none}
#list li{display:flex;flex-wrap:wrap;gap:6px;padding:3px 0;border-bottom:1px solid #eef3f6;align-items:center}
#list small{color:#678;margin-left:auto}#list input{padding:0}.gc{flex-basis:100%;font-size:11px;color:#1b7a3a;padding-left:24px}#bulk button{padding:3px 8px;font-size:12px}#bulk{font-size:12px}#list button{padding:1px 7px;background:var(--red)}
#out{width:100%;height:190px;font:12px/1.4 Consolas,monospace;white-space:pre}
#hint{color:#456;min-height:34px}
</style>
</head>
<body>
<header>
 <h1>Geo<i>Sketch</i> · Data Feed</h1>
 <select id="map"></select>
 <span id="cell">කොටුව: –</span>
 <a href="index.html" style="margin-left:auto;color:#9fd8f7">← GeoSketch</a>
 <a href="#" id="lo" style="color:#fff">Logout</a>
</header>
<div class="app">
 <div id="vp"><div id="box"><canvas id="cv"></canvas></div></div>
 <aside>
  <div class="box tools"><h3>මෙවලම</h3>
   <label><input type="radio" name="t" value="p" checked> ● ස්ථානයක් (තිත + නම)</label>
   <label><input type="radio" name="t" value="pa"> ➚ ඊතලයෙන් (1: තිත, 2: නම තබන තැන)</label>
   <label><input type="radio" name="t" value="na"> ➜ ඊතලය පමණක් (තිත නැතිව – ගඟක නම ආදියට)</label>
   <label><input type="radio" name="t" value="d"> ‖ අමුණ / ඇළ (සමාන්තර රේඛා ද්විත්වය)</label>
   <label><input type="radio" name="t" value="a"> ▭ ප්‍රදේශයක් (Area – වර්ණ)</label>
   <label><input type="radio" name="t" value="r"> ≈ ගඟක් (මාර්ගය දිගේ නම)</label>
   <label><input type="radio" name="t" value="mv"> ✋ නම් / තිත් Move කරන්න (drag)</label>
  </div>
  <div class="box"><h3>නම</h3>
   <input id="name" placeholder="උදා: මහවැලි ගඟ">
   <div class="row" style="margin-top:6px"><span>වර්ණය</span><input id="col" type="color" value="#ff9800" style="padding:0;width:42px">
   <select id="pat" title="ප්‍රදේශයේ Pattern"><option value="s">සම්පූර්ණ වර්ණය</option><option value="h">තිරස් රේඛා</option><option value="v">සිරස් රේඛා</option><option value="d1">ඇලි රේඛා /</option><option value="d2">ඇලි රේඛා \</option><option value="g">කොටු</option><option value="x">ඇල කොටු</option><option value="o">තිත්</option></select>
   <label><input id="hl" type="checkbox"> අමුණේ නම සිතියමේ නොලියන්න</label>
   <span>අකුරු</span><input id="fsz" type="range" min="16" max="48" value="26" style="width:90px"></div>
   <div style="margin-top:8px"><b>වර්ග</b> <small style="color:#678">(එකකට වඩා තෝරා ගත හැක · ඊළඟ අයිතමවලටත් රඳා පවතී)</small><div id="cpk"></div></div>
   <div style="margin-top:8px"><b>විභාග වර්ෂය</b> <small style="color:#678">(ස්ථානය ලැබුණු විභාග වර්ෂ; කිහිපයක් තෝරා ගත හැක)</small><div id="ypk"></div></div>
   <div class="row" style="margin-top:6px"><button id="fin">අවසන් (Enter)</button><button class="alt" id="undo">Undo</button><button class="alt" id="cancel">අවලංගු</button></div>
   <div id="hint"></div>
  </div>
  <div class="box"><h3>ලකුණු කළ ස්ථාන</h3>
   <div class="row" id="bulk" style="margin-bottom:6px">
    <label><input type="checkbox" id="ball"> සියල්ල</label>
    <span>වර්ග:</span>
    <button class="alt" data-f="g" data-m="add" title="ටික් කළ අයිතමවලට, 'වර්ග' හි තෝරා ඇති වර්ග එක් කරයි">＋</button>
    <button class="alt" data-f="g" data-m="del" title="ටික් කළ අයිතමවලින්, 'වර්ග' හි තෝරා ඇති වර්ග ඉවත් කරයි">−</button>
    <button class="alt" data-f="g" data-m="set" title="ටික් කළ අයිතමවල වර්ග, තෝරා ඇති ඒවාම පමණක් කරයි">＝</button>
    <span style="margin-left:6px">වර්ෂ:</span>
    <button class="alt" data-f="yr" data-m="add" title="ටික් කළ අයිතමවලට, 'විභාග වර්ෂය' හි තෝරා ඇති වර්ෂ එක් කරයි">＋</button>
    <button class="alt" data-f="yr" data-m="del" title="ටික් කළ අයිතමවලින්, තෝරා ඇති වර්ෂ ඉවත් කරයි">−</button>
    <button class="alt" data-f="yr" data-m="set" title="ටික් කළ අයිතමවල වර්ෂ, තෝරා ඇති ඒවාම පමණක් කරයි">＝</button>
    <button class="alt" id="bguess" title="වර්ගයක් නැති අයිතමවලට නම අනුව වර්ග යොදයි">නම අනුව අනුමාන</button>
   </div>
   <ul id="list"></ul></div>
  <div class="box"><h3>GeoSketch වෙත paste කිරීමට Code</h3>
   <textarea id="out" spellcheck="false"></textarea>
   <div class="row" style="margin-top:6px"><button id="copy">Copy</button><button class="alt" id="loadc">මෙම Code එක load කරන්න</button><button class="alt" id="reset">සියල්ල මකන්න</button></div>
  </div>
 </aside>
</div>
<script src="geosketch-core.js"></script>
<script>
if(!isAdmin())location.replace('index.html');
const $=id=>document.getElementById(id),cv=$('cv');
let cur,img,L,items=[],tmp=[],pend=null,drag=null;
const Z=setupZoom(cv,$('box'),()=>L,$('vp'));
MAPS.forEach(m=>$('map').add(new Option(m.name,m.k)));
const tool=()=>document.querySelector('[name=t]:checked').value;
const TL={p:'ස්ථානය',a:'ප්‍රදේශය',r:'ගඟ',d:'අමුණ/ඇළ'},IC={p:'●',a:'▭',r:'≈',d:'‖'};
const hints={
 p:'සිතියමේ ස්ථානය click කරන්න.',
 pa:'පළමුව ස්ථානය, ඉන්පසු නම තබන තැන click කරන්න.',
 na:'පළමුව ඊතලය පෙන්විය යුතු තැන, ඉන්පසු නම තබන තැන click කරන්න (තිතක් නොඇඳේ).',
 d:'අමුණ/ඇළ දිගේ ලක්ෂ්‍ය 2ක් හෝ වැඩි ගණනක් click කර "අවසන්" ඔබන්න.',
 a:'ප්‍රදේශයේ මායිම ලක්ෂ්‍ය click කර "අවසන්" ඔබන්න.',
 r:'ගඟ දිගේ ලක්ෂ්‍ය click කර "අවසන්" ඔබන්න (ගඟ ගලන දිශාවට අවශ්‍ය නැත).',
 mv:'නමක් (හෝ තිතක්) මත mouse එක තබා drag කරන්න. ඊතලය ස්වයංක්‍රීයව දිගු/කෙටි වී 90° හැරේ.'
};
const r4=n=>Math.round(n*1e4)/1e4;
/* ---- වර්ග ---- */
const ck=new Set();/* ලැයිස්තුවේ ටික් කළ අයිතම */
const loadCustom=()=>{try{return JSON.parse(localStorage.getItem('gs_cats')||'[]');}catch(e){return[];}};
function allCats(){const u=[];MAPS.forEach(m=>{try{u.push(usedCats(cur&&m.k==cur.k?items:JSON.parse(localStorage.getItem('gs_'+m.k)||'[]')));}catch(e){}});return catList(loadCustom(),...u);}
const cp=catPicker($('cpk'),{list:allCats,onNew:n=>{const a=loadCustom();if(!a.includes(n)){a.push(n);try{localStorage.setItem('gs_cats',JSON.stringify(a));}catch(e){}}}});
const loadYears=()=>{try{return JSON.parse(localStorage.getItem('gs_years')||'[]');}catch(e){return[];}};
function allYears(){const u=[];MAPS.forEach(m=>{try{u.push(usedYears(cur&&m.k==cur.k?items:JSON.parse(localStorage.getItem('gs_'+m.k)||'[]')));}catch(e){}});return yearList(loadYears(),...u);}
const ypk=catPicker($('ypk'),{list:allYears,ph:'— Dropdown එකෙන් වර්ෂයක් තෝරන්න —',newBtn:'➕ වෙනත් වර්ෂයක්',newPh:'උදා: 2022 හෝ 2022(2021)',empty:'වර්ෂයක් තෝරා නැත (අවශ්‍ය නැතිනම් එලෙසම තබන්න)',
 onNew:n=>{const a=loadYears();if(!a.includes(n)){a.push(n);try{localStorage.setItem('gs_years',JSON.stringify(a));}catch(e){}}}});
const G=()=>{const g=cp.get(),y=ypk.get();return Object.assign(g.length?{g}:{},y.length?{yr:y}:{});};

async function load(k){
 cur=MAPS.find(m=>m.k==k);await fontReady();
 try{img=await loadImg(cur.url);}catch(e){alert('රූපය load වුණේ නැත');return;}
 L=layout(img);tmp=[];pend=null;Z.reset();
 try{items=JSON.parse(localStorage.getItem('gs_'+k)||'[]');}catch(e){items=[];}
 ck.clear();cp.refresh();ypk.refresh();redraw();
}
function save(){try{localStorage.setItem('gs_'+cur.k,JSON.stringify(items));}catch(e){}}
function redraw(){
 const g=render(cv,img,L,items,{fs:+$('fsz').value});
 const X=x=>L.ix+x*L.iw,Y=y=>L.iy+y*L.ih;
 g.strokeStyle=g.fillStyle='#ff6f00';g.lineWidth=3;
 if(pend){g.beginPath();g.arc(X(pend[0]),Y(pend[1]),3,0,7);g.fill();}
 if(tmp.length){g.beginPath();tmp.forEach((p,i)=>i?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1])));g.stroke();}
 $('hint').textContent=hints[tool()];
 const ul=$('list');ul.innerHTML='';
 items.forEach((it,i)=>{const li=document.createElement('li');
  const cb=document.createElement('input');cb.type='checkbox';cb.checked=ck.has(i);cb.onchange=()=>{cb.checked?ck.add(i):ck.delete(i);};li.appendChild(cb);
  li.insertAdjacentHTML('beforeend',`<span>${it.nd?'➜':IC[it.t]} ${it.n}</span><small>${itemCells(L,it).slice(0,6).join(' ')}</small>`);
  const b=document.createElement('button');b.textContent='×';b.onclick=()=>{items.splice(i,1);ck.clear();changed();};li.appendChild(b);
  if((it.g&&it.g.length)||(it.yr&&it.yr.length))li.insertAdjacentHTML('beforeend',`<span class="gc">${it.g&&it.g.length?'🏷 '+it.g.join(' · '):''}${it.yr&&it.yr.length?'  📅 '+it.yr.join(', '):''}</span>`);
  ul.appendChild(li);});
 $('out').value=code();
}
function code(){
 return `// >>> MAP:${cur.k}\nDATA['${cur.k}']=[\n`+
  items.map(it=>`  // ${it.n} [${TL[it.t]}]${it.g&&it.g.length?' {'+it.g.join(', ')+'}':''}${it.yr&&it.yr.length?' <'+it.yr.join(', ')+'>':''}\n  ${JSON.stringify(it)}`).join(',\n')+`\n];\n// <<< MAP:${cur.k}`;
}
function changed(){save();cp.refresh();ypk.refresh();redraw();}
function nm(){const n=$('name').value.trim();if(!n){alert('පළමුව නම ඇතුළත් කරන්න');$('name').focus();}return n;}

/* ---------- Click කර ලකුණු කිරීම ---------- */
cv.onclick=e=>{
 if(tool()=='mv')return;
 const[x,y]=pointer(cv,L,e);if(x<0||y<0||x>1||y>1)return;
 const t=tool(),p=[r4(x),r4(y)];
 if(t=='p'){const n=nm();if(!n)return;items.push(Object.assign({n,t:'p',x:p[0],y:p[1]},G()));$('name').value='';changed();}
 else if(t=='pa'||t=='na'){
  if(!pend){if(!nm())return;pend=p;redraw();}
  else{items.push(Object.assign({n:$('name').value.trim(),t:'p',x:pend[0],y:pend[1],lx:p[0],ly:p[1]},t=='na'?{nd:1}:{},G()));pend=null;$('name').value='';changed();}
 }else{tmp.push(p);redraw();}
};

/* ---------- නම් / තිත් Move කිරීම (drag) ---------- */
function hit(e){
 const[nx,ny]=pointer(cv,L,e),fs=+$('fsz').value,g=cv.getContext('2d'),
  X=x=>L.ix+x*L.iw,Y=y=>L.iy+y*L.ih,mx=X(nx),my=Y(ny);
 g.font=`${fs}px ${FONT}`;
 for(let i=items.length-1;i>=0;i--){const it=items[i];if(it.t!='p')continue;
  const x=X(it.x),y=Y(it.y),r=it.nd?0:fs*.14,w=g.measureText(it.n).width;
  if(Math.hypot(mx-x,my-y)<=Math.max(10,r+6))return{i,w:'d'};
  let cx,cy;
  if(it.lx!=null){cx=X(it.lx);cy=Y(it.ly);}else{cx=x+r+6+w/2;cy=y-fs*.45;}
  if(Math.abs(mx-cx)<=w/2+8&&Math.abs(my-cy)<=fs/2+8)return{i,w:'l',cx,cy};
 }
 return null;
}
cv.onpointerdown=e=>{
 if(tool()!='mv')return;const h=hit(e);if(!h)return;
 const it=items[h.i],[nx,ny]=pointer(cv,L,e),k=h.w=='l'?['lx','ly']:['x','y'];
 /* ඊතලයක් නැති සාමාන්‍ය නමක් නම්, දැනට නම තිබෙන තැනින් පටන් ගනී */
 const bx=h.w=='l'&&it.lx==null?(h.cx-L.ix)/L.iw:it[k[0]],
       by=h.w=='l'&&it.lx==null?(h.cy-L.iy)/L.ih:it[k[1]];
 drag={it,k,ox:bx-nx,oy:by-ny};
 cv.setPointerCapture(e.pointerId);e.preventDefault();
};
cv.onpointermove=e=>{
 const[x,y]=pointer(cv,L,e);
 $('cell').textContent='කොටුව: '+(x<0||y<0||x>1||y>1?'–':cellId(L,x,y));
 if(drag){const c=v=>r4(Math.min(1,Math.max(0,v)));
  drag.it[drag.k[0]]=c(x+drag.ox);drag.it[drag.k[1]]=c(y+drag.oy);redraw();}
 else if(tool()=='mv')cv.style.cursor=hit(e)?'move':'default';
};
cv.onpointerup=cv.onpointercancel=()=>{if(drag){drag=null;changed();}};

/* ---------- අනෙකුත් බොත්තම් ---------- */
function finish(){
 const t=tool();if(t!='a'&&t!='r'&&t!='d')return;
 if(tmp.length<(t=='a'?3:2)){alert(t=='a'?'ලක්ෂ්‍ය 3ක්වත් අවශ්‍යයි':'ලක්ෂ්‍ය 2ක්වත් අවශ්‍යයි');return;}
 const n=nm();if(!n)return;
 items.push(Object.assign(t=='a'?{n,t:'a',c:$('col').value,pt:$('pat').value,pts:tmp}:t=='d'?Object.assign({n,t:'d',pts:tmp},$('hl').checked?{hl:1}:{}):{n,t:'r',pts:tmp},G()));tmp=[];$('name').value='';changed();
}
$('fin').onclick=finish;
$('undo').onclick=()=>{if(pend)pend=null;else if(tmp.length)tmp.pop();else{items.pop();ck.clear();}changed();};
$('cancel').onclick=()=>{tmp=[];pend=null;redraw();};
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&document.activeElement.id!='out')finish();if(e.key=='Escape'){tmp=[];pend=null;redraw();}});
document.querySelectorAll('[name=t]').forEach(r=>r.onchange=()=>{tmp=[];pend=null;
 cv.style.cursor=tool()=='mv'?'default':'crosshair';
 cv.style.touchAction=tool()=='mv'?'none':'manipulation';redraw();});
$('fsz').oninput=redraw;
$('map').onchange=e=>load(e.target.value);
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('out').value);}catch(e){$('out').select();document.execCommand('copy');}$('copy').textContent='Copy වුණා ✓';setTimeout(()=>$('copy').textContent='Copy',1500);};
$('loadc').onclick=()=>{try{const m=$('out').value.match(/=\s*(\[[\s\S]*\])/);items=new Function('return '+m[1])();ck.clear();changed();}catch(e){alert('Code එක කියවිය නොහැක');}};
$('reset').onclick=()=>{if(confirm('මෙම සිතියමේ සියල්ල මකන්නද?')){items=[];ck.clear();changed();}};
$('lo').onclick=()=>{sessionStorage.removeItem('gs_admin');location.href='index.html';};
/* ---------- වර්ග: ටික් කළ අයිතමවලට bulk ක්‍රියා ---------- */
function bulkOp(fl,mode){
 if(!ck.size){alert('පළමුව ලැයිස්තුවේ අයිතම ටික් කරන්න');return;}
 const P=fl=='g'?cp:ypk,nm=fl=='g'?'වර්ග':'වර්ෂ',v=P.get();
 if(mode!='set'&&!v.length){alert(`ඉහත "${nm}" කොටුවේ Dropdown එකෙන් ${nm} තෝරන්න`);return;}
 if(mode=='set'&&!v.length&&!confirm(`ටික් කළ අයිතමවල ${nm} සියල්ල ඉවත් කරන්නද?`))return;
 ck.forEach(i=>{const it=items[i];if(!it)return;const o=it[fl]||[];
  it[fl]=mode=='add'?[...new Set([...o,...v])]:mode=='del'?o.filter(c=>!v.includes(c)):v.slice();
  if(!it[fl].length)delete it[fl];});
 changed();
}
document.querySelectorAll('#bulk [data-f]').forEach(b=>b.onclick=()=>bulkOp(b.dataset.f,b.dataset.m));
$('ball').onchange=ev=>{ck.clear();if(ev.target.checked)items.forEach((_,i)=>ck.add(i));redraw();};
$('bguess').onclick=()=>{
 const t=items.filter(it=>!(it.g&&it.g.length)&&guessCats(it).length);
 if(!t.length){alert('අනුමාන කළ හැකි, වර්ගයක් නැති අයිතම නැත');return;}
 if(!confirm(`වර්ගයක් නැති අයිතම ${t.length}කට නම අනුව වර්ග යොදන්නද?\n(…ගඟ / …ඔය / …ආරු → ගංගාව, …වැව → වැව, ඇළ, අමුණ)\nපසුව ඒවා වෙනස් කළ හැක.`))return;
 t.forEach(it=>it.g=guessCats(it));changed();
};
load(MAPS[0].k);
</script>
